<!DOCTYPE html>
<html>
<head>
    <title>Convert SVG to PNG</title>
</head>
<body>
    <h1>SVG to PNG Converter</h1>
    <div id="output"></div>
    
    <script>
        // SVG content for different sizes
        const svgContent = `<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="4"/>
  
  <!-- Main cursor icon -->
  <path d="M64 20L100 64L64 108L28 64L64 20Z" fill="url(#cursorGradient)" stroke="white" stroke-width="3"/>
  
  <!-- Inner highlight -->
  <path d="M64 28L88 64L64 100L40 64L64 28Z" fill="url(#highlightGradient)" opacity="0.7"/>
  
  <!-- Center dot -->
  <circle cx="64" cy="64" r="8" fill="white"/>
  
  <!-- FlowSonat text -->
  <text x="64" y="120" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    FS
  </text>
  
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>
    
    <linearGradient id="cursorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.7" />
    </linearGradient>
    
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.3" />
    </linearGradient>
  </defs>
</svg>`;

        const sizes = [16, 48, 128];
        
        function convertToPNG(size) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;
            
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);
                
                // Create download link
                const link = document.createElement('a');
                link.download = `icon${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.textContent = `Download ${size}x${size} PNG`;
                link.style.display = 'block';
                link.style.margin = '10px';
                link.style.padding = '10px';
                link.style.backgroundColor = '#f0f0f0';
                link.style.textDecoration = 'none';
                link.style.color = '#333';
                link.style.borderRadius = '5px';
                
                document.getElementById('output').appendChild(link);
            };
            
            const svgBlob = new Blob([svgContent], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(svgBlob);
            img.src = url;
        }
        
        // Convert all sizes
        sizes.forEach(size => convertToPNG(size));
    </script>
</body>
</html>
